        typeSeance: { $ref: '#/components/schemas/Reference' }
        photographe: { $ref: '#/components/schemas/Reference' }
        client: { $ref: '#/components/schemas/Reference' }

    # ---------- Lot 4 ----------
    StatutPaiement:
