<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>Factures – Studio photo</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .barre-outils { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .barre-outils input[type="search"] { flex: 1; min-width: 200px; }
        /* .carte force le display, sans cette règle le [hidden] ne marche plus */
        #detail[hidden] { display: none; }
        td.numero, td .badge { white-space: nowrap; }
        .compteur { color: var(--texte-doux); font-size: 13px; margin: 0 0 8px; }
        .vide { color: var(--texte-doux); text-align: center; }
        td.actions-ligne { white-space: nowrap; text-align: right; }
        td.actions-ligne button { padding: 4px 10px; }
        td.montant, th.montant { text-align: right; white-space: nowrap; }
        tr.selectionnee td { background: #eef4fa; }
        /* lien qui ressmble à un bouton (PDF) */
        a.bouton {
            display: inline-block; padding: 8px 14px; border-radius: 6px; text-decoration: none;
            background: var(--principale); color: #fff; font-size: 14px;
        }
        td.actions-ligne a.bouton { padding: 4px 10px; }
        a.bouton.secondaire { background: #fff; color: var(--principale); border: 1px solid var(--principale); }
        .detail-tete { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
        .detail-tete h2 { margin: 0; }
        .deux-colonnes { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
        .deux-colonnes h3 { margin: 16px 0 4px; font-size: 14px; color: var(--texte-doux); text-transform: uppercase; }
        .deux-colonnes p { margin: 2px 0; }
        table.montants { width: auto; margin-left: auto; margin-top: 16px; }
        table.montants td { padding: 4px 16px; }
        table.montants tr.total td { font-weight: bold; border-top: 2px solid var(--bordure); }
        @media (max-width: 640px) {
            .deux-colonnes { grid-template-columns: 1fr; }
            .masquable { display: none; }
            table.montants { width: 100%; }
        }
    </style>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/facturation.js"></script>
    <script src="js/factures.js"></script>
</head>
<body data-rubrique="factures.html">
<header id="entete"></header>

<main>
    <div id="messages"></div>

    <h1>Factures</h1>
    <section id="detail" class="carte" hidden aria-live="polite"></section>

    <div class="barre-outils">
        <input type="search" id="recherche" placeholder="Rechercher (numéro, client, email...)"
               aria-label="Rechercher une facture">
        <select id="filtre-statut" aria-label="Filtrer par statut de paiement">
            <option value="">Tous les statuts</option>
            <option value="EN_ATTENTE">En attente</option>
            <option value="PAYEE">Payées</option>
            <option value="ANNULEE">Annulées</option>
        </select>
    </div>

    <p id="compteur" class="compteur"></p>
    <table>
        <thead>
        <tr>
            <th>Numéro</th>
            <th>Émise le</th>
            <th>Client</th>
            <th class="masquable">Prestation</th>
            <th class="montant">Total TTC</th>
            <th>Statut</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="liste-factures">
        <tr><td colspan="7" class="vide">Chargement...</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
